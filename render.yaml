services:
  - type: web
    runtime: static
    name: deonchingwe-site
    branch: main
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
